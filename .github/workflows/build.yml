name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer commit on the same branch or PR cancels the older run. Builds of main are
# never cancelled, so a release that is being published always finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Test core
        run: ./gradlew -p core test --console=plain

      - name: Prepare signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          elif [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "::error::The SIGNING_KEYSTORE_BASE64 secret is missing; builds of main must be signed."
            exit 1
          else
            echo "::warning::No signing key available; the APK will be unsigned and cannot be installed."
          fi

      # The run number becomes the versionCode, so each build is newer than the previous one.
      - name: Build release APK
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew :app:assembleRelease -PbuildNumber=${{ github.run_number }} --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: foodlogger-apk
          path: app/build/outputs/apk/release/*.apk

      # Builds of main become GitHub releases, which the app offers as in-app updates.
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk foodlogger.apk
          gh release create "build-${{ github.run_number }}" foodlogger.apk \
            --target "$GITHUB_SHA" \
            --title "Build ${{ github.run_number }}" \
            --generate-notes
